<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Homie</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9b1c1c', // Dark red from design
                        'primary-light': '#fef2f2',
                        background: '#fafaf9',
                        pinky: '#fce7f3',
                        mint: '#ccfbf1',
                        peach: '#ffedd5'
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons (Using known stable UMD version) -->
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f5f5f4;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        
        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }

        /* Smooth check transition */
        .check-anim { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }
    </style>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your specific Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDjsOl2yNdQ6ALZD9OMJ7mkWjWPpiNNUUk",
            authDomain: "daily-life-178d9.firebaseapp.com",
            projectId: "daily-life-178d9",
            storageBucket: "daily-life-178d9.firebasestorage.app",
            messagingSenderId: "577188185718",
            appId: "1:577188185718:web:c46258a854802bde1f4157",
            measurementId: "G-DBG56W0NLW"
        };

        window.firebaseApp = initializeApp(firebaseConfig);
        window.firebaseDb = getFirestore(window.firebaseApp);
        window.firebaseAuth = getAuth(window.firebaseApp);
        
        // Export to React scope
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.onAuthStateChanged = onAuthStateChanged;
        window.doc = doc;
        window.setDoc = setDoc;
        window.onSnapshot = onSnapshot;
        window.collection = collection;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const lucide = window.LucideReact || window.lucideReact || window.lucide;
        
        const { 
            Home, ShoppingCart, Calendar: CalendarIcon, PawPrint, Wallet, User,
            ChevronRight, ChevronLeft, Plus, Check, Search, Bell, Settings,
            Trophy, Droplets, Pill, Scissors, Bone, Flame, Lightbulb, Activity,
            Coffee, Utensils, Zap, Wifi, ArrowRight, X, Clock, MapPin, Repeat,
            Smile, Frown, Meh, Angry, Heart, Trash2, PiggyBank, Eye, EyeOff
        } = lucide;

        const USERS = { ME: 'Cartune', PARTNER: 'Gun' };
        const appId = 'daily-life';

        const TopBar = ({ title, subtitle, rightAction, align = 'left' }) => (
            <div className={`flex justify-between items-center p-5 pt-8 bg-background sticky top-0 z-40 bg-opacity-95 backdrop-blur-md`}>
                <div className={align === 'center' ? 'mx-auto text-center' : ''}>
                    <h1 className="text-2xl font-black flex items-center gap-2 text-primary">
                        {title}
                    </h1>
                    {subtitle && <p className="text-sm text-gray-500 font-medium mt-1">{subtitle}</p>}
                </div>
                {rightAction && <div className={align === 'center' ? 'absolute right-5' : ''}>{rightAction}</div>}
            </div>
        );

        const BottomNav = ({ activeTab, setActiveTab, shoppingCount }) => {
            const tabs = [
                { id: 'home', icon: Home, label: 'Home' },
                { id: 'shopping', icon: ShoppingCart, label: 'Shopping', badge: shoppingCount },
                { id: 'calendar', icon: CalendarIcon, label: 'Calendar' },
                { id: 'pet', icon: PawPrint, label: 'Pet' },
                { id: 'finance', icon: Wallet, label: 'Finance' },
                // Note: User profile tab skipped to maintain standard 5-tab layout as common in PWAs
            ];

            return (
                <div className="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 safe-bottom px-4 py-2 flex justify-between z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                    {tabs.map(tab => {
                        const Icon = tab.icon;
                        const isActive = activeTab === tab.id;
                        return (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center p-2 rounded-xl transition-all duration-300 w-14 relative ${isActive ? 'text-primary' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                <div className="relative">
                                    <Icon size={isActive ? 24 : 22} strokeWidth={isActive ? 2.5 : 2} className={isActive ? '-translate-y-1 transition-transform' : 'transition-transform'} />
                                    {tab.badge > 0 && (
                                        <span className="absolute -top-1.5 -right-2 bg-primary text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full border border-white shadow-sm">
                                            {tab.badge}
                                        </span>
                                    )}
                                </div>
                                <span className={`text-[10px] mt-1 font-bold ${isActive ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{tab.label}</span>
                            </button>
                        );
                    })}
                </div>
            );
        };

        const HomeScreen = ({ setActiveTab, shoppingList, events, pets }) => {
            const pendingShopping = shoppingList.filter(i => !i.completed).length;
            const todayEvents = events.filter(e => e.date === new Date().toISOString().split('T')[0]).length;

            return (
                <div className="h-full bg-background pb-28 overflow-y-auto animate-in fade-in duration-500">
                    <TopBar 
                        title={<span className="flex items-center gap-2"><img src="https://ui-avatars.com/api/?name=OH&background=9b1c1c&color=fff&rounded=true&size=32" alt="logo" className="w-8 h-8"/> Our Homie</span>} 
                        rightAction={<div className="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-500"><User size={20}/></div>} 
                    />
                    
                    <div className="px-5 space-y-8 mt-2">
                        {/* 4 Grid Shortcuts */}
                        <div className="grid grid-cols-4 gap-3">
                            <button onClick={() => setActiveTab('shopping')} className="bg-pink-100/60 p-4 rounded-[1.25rem] flex flex-col items-center justify-center gap-2 shadow-sm border border-pink-50 active:scale-95 transition-transform">
                                <div className="text-pink-500"><ShoppingCart size={24} /></div>
                                <div className="text-center"><p className="font-black text-gray-800 text-xl">{pendingShopping}</p><p className="text-[10px] text-gray-500 font-bold">Shopping</p></div>
                            </button>
                            <button onClick={() => setActiveTab('calendar')} className="bg-teal-50 p-4 rounded-[1.25rem] flex flex-col items-center justify-center gap-2 shadow-sm border border-teal-50/50 active:scale-95 transition-transform">
                                <div className="text-teal-500"><CalendarIcon size={24} /></div>
                                <div className="text-center"><p className="font-black text-gray-800 text-xl">{todayEvents}</p><p className="text-[10px] text-gray-500 font-bold">Events</p></div>
                            </button>
                            <button onClick={() => setActiveTab('pet')} className="bg-orange-50 p-4 rounded-[1.25rem] flex flex-col items-center justify-center gap-2 shadow-sm border border-orange-100/50 active:scale-95 transition-transform">
                                <div className="text-orange-400"><PawPrint size={24} /></div>
                                <div className="text-center"><p className="font-black text-gray-800 text-xl">{pets.length}</p><p className="text-[10px] text-gray-500 font-bold">Pet Care</p></div>
                            </button>
                            <button onClick={() => setActiveTab('finance')} className="bg-red-50 p-4 rounded-[1.25rem] flex flex-col items-center justify-center gap-2 shadow-sm border border-red-100/50 active:scale-95 transition-transform">
                                <div className="text-primary"><PiggyBank size={24} /></div>
                                <div className="text-center"><p className="font-black text-primary text-xl">194%</p><p className="text-[10px] text-gray-500 font-bold">Budget</p></div>
                            </button>
                        </div>

                        {/* Awards Section */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-end"><h2 className="text-xl font-black text-gray-900">Awards</h2><span className="text-primary text-sm font-bold flex items-center cursor-pointer">View All <ChevronRight size={16}/></span></div>
                            <div className="bg-red-50/80 rounded-[1.5rem] p-5 flex items-center gap-4 border border-red-100">
                                <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm text-primary shrink-0"><Trophy size={20} /></div>
                                <div className="flex-1">
                                    <p className="text-xs text-gray-500 font-bold">Your points</p>
                                    <p className="text-2xl font-black text-gray-900">0 <span className="text-sm font-bold text-gray-500">/ 100 pts</span></p>
                                    <p className="text-xs text-primary font-bold mt-0.5">Next: ย้อมผมที่ enrich</p>
                                </div>
                                <ChevronRight className="text-gray-400 shrink-0" />
                            </div>
                        </div>

                        {/* Today's Pet */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-end"><h2 className="text-xl font-black text-gray-900">Today's Pet</h2><span className="text-primary text-sm font-bold flex items-center cursor-pointer" onClick={() => setActiveTab('pet')}>View All <ChevronRight size={16}/></span></div>
                            <div className="bg-gradient-to-r from-teal-50 to-cyan-50 rounded-[1.5rem] p-4 flex items-center gap-4 border border-teal-100/50">
                                <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center text-teal-400 shadow-sm shrink-0 overflow-hidden">
                                    <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?ixlib=rb-1.2.1&auto=format&fit=crop&w=150&q=80" alt="Leah" className="w-full h-full object-cover" />
                                </div>
                                <div className="flex-1">
                                    <h3 className="font-black text-xl text-gray-900">Leah</h3>
                                    <p className="text-teal-600 text-xs font-bold flex items-center gap-1 mt-1"><Droplets size={12}/> Shower</p>
                                </div>
                                <button onClick={() => setActiveTab('pet')} className="w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center shadow-md shrink-0"><ArrowRight size={20}/></button>
                            </div>
                        </div>

                        {/* Shopping Quick List */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-end"><h2 className="text-xl font-black text-gray-900">Shopping List</h2><span className="text-primary text-sm font-bold flex items-center cursor-pointer" onClick={() => setActiveTab('shopping')}>View All <ChevronRight size={16}/></span></div>
                            <div className="bg-white rounded-[1.5rem] p-2 shadow-sm border border-gray-100">
                                {shoppingList.filter(i => !i.completed).slice(0, 3).map((item, idx) => (
                                    <div key={item.id} className={`flex justify-between items-center p-3 ${idx !== 2 && idx !== shoppingList.length - 1 ? 'border-b border-gray-50' : ''}`}>
                                        <div className="flex items-center gap-4">
                                            <div className="w-5 h-5 rounded-md border-2 border-gray-200"></div>
                                            <span className="text-gray-700 font-bold text-sm">{item.text}</span>
                                        </div>
                                        <span className="text-[10px] font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full">{item.category}</span>
                                    </div>
                                ))}
                                {pendingShopping === 0 && <p className="text-center text-gray-400 py-6 text-sm font-bold">All caught up!</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ShoppingScreen = ({ list, onAdd, onUpdate, onDelete }) => {
            const [filter, setFilter] = useState('All');
            const [newItemText, setNewItemText] = useState('');
            
            const categories = [
                { id: 'All', icon: Search }, // Generic icon for All
                { id: 'Food', icon: Utensils },
                { id: 'Home', icon: Home },
                { id: 'Health', icon: Pill },
                { id: 'Pets', icon: PawPrint }
            ];

            const activeItems = list.filter(i => (filter === 'All' || i.category === filter) && !i.completed);

            const handleAddItem = (e) => {
                e.preventDefault();
                if (!newItemText.trim()) return;
                onAdd('shopping', { text: newItemText, category: filter === 'All' ? 'Home' : filter, completed: false, addedBy: USERS.ME, date: new Date().toISOString() });
                setNewItemText('');
            };

            return (
                <div className="h-full bg-background pb-28 flex flex-col animate-in fade-in">
                    <TopBar title={<span className="flex items-center gap-2"><ShoppingCart className="text-primary" size={28}/> Shopping List</span>} subtitle={`Added by ${USERS.ME} & ${USERS.PARTNER}`} />
                    
                    {/* Filter Pills */}
                    <div className="px-5 py-2 overflow-x-auto whitespace-nowrap hide-scrollbar flex gap-2">
                        {categories.map(cat => (
                            <button 
                                key={cat.id} 
                                onClick={() => setFilter(cat.id)}
                                className={`inline-flex items-center gap-1.5 px-4 py-2 rounded-full font-bold text-xs transition-all
                                ${filter === cat.id ? 'bg-primary text-white shadow-md' : 'bg-red-50 text-gray-600 hover:bg-red-100'}`}
                            >
                                {cat.id !== 'All' && <cat.icon size={14} />} {cat.id}
                            </button>
                        ))}
                    </div>

                    <div className="px-5 mt-4 flex-1 overflow-y-auto">
                        <div className="bg-white rounded-[1.5rem] p-2 shadow-sm border border-gray-100">
                            {activeItems.map((item, idx) => (
                                <div key={item.id} className={`flex items-center justify-between p-3.5 group ${idx !== activeItems.length - 1 ? 'border-b border-gray-50' : ''}`}>
                                    <div className="flex items-center gap-4 flex-1 cursor-pointer" onClick={() => onUpdate('shopping', item.id, { completed: !item.completed })}>
                                        <div className="w-5 h-5 rounded-md border-2 border-gray-200 flex items-center justify-center bg-white check-anim">
                                            {item.completed && <Check size={14} className="text-primary" strokeWidth={3} />}
                                        </div>
                                        <span className="text-gray-700 font-bold text-sm">{item.text}</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-[10px] font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full">{item.category}</span>
                                        <button onClick={(e) => { e.stopPropagation(); onDelete('shopping', item.id); }} className="text-gray-300 hover:text-red-500 bg-gray-50 p-1.5 rounded-full"><Trash2 size={14}/></button>
                                    </div>
                                </div>
                            ))}
                            
                            {/* Add Item Input */}
                            <form onSubmit={handleAddItem} className="flex items-center gap-3 p-3.5 mt-1">
                                <Plus size={20} className="text-gray-300" />
                                <input 
                                    type="text" 
                                    placeholder="Add item..." 
                                    className="flex-1 bg-transparent outline-none text-gray-700 font-bold text-sm placeholder:font-medium placeholder:text-gray-400"
                                    value={newItemText}
                                    onChange={(e) => setNewItemText(e.target.value)}
                                />
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const CalendarScreen = ({ events, moodHistory, recordMood, onAdd, onUpdate, onDelete }) => {
            const [view, setView] = useState('Month'); 
            const todayStr = new Date().toISOString().split('T')[0];
            const [selectedDate, setSelectedDate] = useState(todayStr);
            const [editingEvent, setEditingEvent] = useState(null);
            
            const handleSaveEvent = () => {
                if (!editingEvent.title) return;
                if (editingEvent.id) {
                    onUpdate('events', editingEvent.id, editingEvent);
                } else {
                    onAdd('events', editingEvent);
                }
                setEditingEvent(null);
            };

            // Setup Calendar Grid (30 days mock for Sept)
            const days = Array.from({length: 30}, (_, i) => {
                const dayNum = i + 1;
                return `2026-09-${dayNum < 10 ? '0'+dayNum : dayNum}`; 
            });

            const moods = [
                { id: 'Happy', icon: Smile, color: 'text-pink-500', bg: 'bg-pink-100' },
                { id: 'Calm', icon: Meh, color: 'text-purple-500', bg: 'bg-purple-100' },
                { id: 'Sad', icon: Frown, color: 'text-blue-500', bg: 'bg-blue-100' },
                { id: 'Angry', icon: Angry, color: 'text-orange-500', bg: 'bg-orange-100' },
                { id: 'Tired', icon: Meh, color: 'text-orange-600', bg: 'bg-orange-100' }
            ];

            const currentMood = moodHistory.find(m => m.date === selectedDate)?.mood;

            return (
                <div className="h-full bg-background pb-28 animate-in fade-in flex flex-col">
                    <TopBar 
                        title={<span className="flex items-center gap-2"><CalendarIcon className="text-primary" size={28}/> Calendar</span>}
                        rightAction={
                            <div className="flex gap-2">
                                <span className="flex items-center gap-1 text-[10px] font-bold bg-red-50 text-gray-700 px-3 py-1.5 rounded-full"><span className="w-2 h-2 rounded-full bg-primary"></span>Shared</span>
                                <span className="flex items-center gap-1 text-[10px] font-bold bg-blue-50 text-gray-700 px-3 py-1.5 rounded-full"><span className="w-2 h-2 rounded-full bg-blue-500"></span>Personal</span>
                            </div>
                        }
                    />
                    
                    <div className="px-5 flex-1 overflow-y-auto">
                        {/* View Toggle */}
                        <div className="flex justify-center mb-6 mt-2">
                            <div className="bg-white rounded-full p-1 shadow-sm flex border border-gray-100">
                                {['Month', 'List', 'Mood'].map(v => (
                                    <button 
                                        key={v}
                                        onClick={() => setView(v)} 
                                        className={`px-5 py-2 rounded-full text-xs font-bold flex items-center gap-1.5 transition-colors ${view === v ? 'bg-red-50 text-primary' : 'text-gray-400'}`}
                                    >
                                        {v === 'Month' && <CalendarIcon size={14}/>}
                                        {v === 'List' && <Activity size={14}/>}
                                        {v === 'Mood' && <Smile size={14}/>}
                                        {v}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {view === 'Mood' && (
                            <div className="bg-white rounded-[1.5rem] p-6 shadow-sm border border-gray-100 mb-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-base font-black flex items-center gap-2 text-gray-800"><Smile className="text-primary"/> How are you feeling today?</h3>
                                    <span className="text-xs text-gray-400 font-bold">Tue, Sep 1</span>
                                </div>
                                <div className="flex justify-between mb-8">
                                    {moods.map(m => (
                                        <button 
                                            key={m.id} 
                                            onClick={() => recordMood(selectedDate, m.id)}
                                            className={`flex flex-col items-center gap-2 transition-all ${currentMood === m.id ? 'scale-110' : 'opacity-80 grayscale hover:grayscale-0'}`}
                                        >
                                            <div className={`w-12 h-12 rounded-2xl ${m.bg} ${m.color} flex items-center justify-center shadow-sm ${currentMood === m.id ? 'ring-2 ring-offset-2 ring-red-200' : ''}`}>
                                                <m.icon size={24} />
                                            </div>
                                            <span className={`text-[10px] font-bold ${currentMood === m.id ? m.color : 'text-gray-400'}`}>{m.id}</span>
                                        </button>
                                    ))}
                                </div>
                                {currentMood && (
                                    <div className="bg-red-50 p-4 rounded-2xl flex items-center gap-4">
                                        <div className={`w-10 h-10 rounded-xl ${moods.find(x=>x.id===currentMood).bg} ${moods.find(x=>x.id===currentMood).color} flex items-center justify-center`}>
                                            {React.createElement(moods.find(x=>x.id===currentMood).icon, {size: 20})}
                                        </div>
                                        <div>
                                            <p className="font-bold text-gray-800 text-sm">{USERS.ME} feeling <span className={moods.find(x=>x.id===currentMood).color.replace('text-', '')}>{currentMood.toLowerCase()}</span></p>
                                            <p className="text-xs text-gray-400 font-bold mt-0.5">{selectedDate}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'Month' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center px-1">
                                    <h2 className="text-xl font-black text-gray-900">September 2026</h2>
                                    <div className="flex gap-2">
                                        <button className="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-400 hover:text-primary"><ChevronLeft size={18}/></button>
                                        <button className="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-400 hover:text-primary"><ChevronRight size={18}/></button>
                                    </div>
                                </div>
                                
                                <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-gray-100">
                                    <div className="grid grid-cols-7 mb-4 text-center">
                                        {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => (
                                            <div key={d} className="text-[10px] font-black text-gray-400 tracking-wider">{d}</div>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-7 gap-y-4 text-center">
                                        <div className="text-gray-300 py-2 text-sm font-bold">30</div>
                                        <div className="text-gray-300 py-2 text-sm font-bold">31</div>
                                        {days.map((fullDate, i) => {
                                            const dayNum = i + 1;
                                            const hasEvent = events.some(e => e.date === fullDate);
                                            const isSelected = selectedDate === fullDate;
                                            return (
                                                <div key={fullDate} onClick={() => setSelectedDate(fullDate)} className="flex flex-col items-center justify-center cursor-pointer">
                                                    <div className={`w-9 h-9 flex items-center justify-center rounded-xl text-sm font-bold transition-all ${isSelected ? 'border-2 border-primary text-primary' : 'text-gray-800 hover:bg-gray-50'}`}>
                                                        {dayNum}
                                                    </div>
                                                    <div className="h-1 mt-1 flex gap-0.5">
                                                        {hasEvent && <div className="w-1 h-1 rounded-full bg-primary"></div>}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                {/* Events List */}
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-sm font-black text-primary flex items-center gap-2">

                                <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-2 block">Amount (฿) *</label><input type="number" value={expForm.amount} onChange={e => setExpForm({...expForm, amount: e.target.value})} className="w-full bg-white border border-gray-200 rounded-2xl p-4 shadow-sm font-black text-xl text-gray-900 outline-none" /></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-2 block">Paid By</label><select value={expForm.paidBy} onChange={e => setExpForm({...expForm, paidBy: e.target.value})} className="w-full bg-white border border-gray-200 rounded-2xl p-4 shadow-sm font-bold text-gray-900 outline-none appearance-none"><option value={USERS.ME}>{USERS.ME}</option><option value={USERS.PARTNER}>{USERS.PARTNER}</option></select></div>
                                    <div><label className="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-2 block">Category</label><select value={expForm.category} onChange={e => setExpForm({...expForm, category: e.target.value})} className="w-full bg-white border border-gray-200 rounded-2xl p-4 shadow-sm font-bold text-gray-900 outline-none appearance-none"><option value="Food">Food</option><option value="Home Supplies">Home Supplies</option><option value="Utilities">Utilities</option><option value="Pets">Pets</option><option value="Personal">Personal</option></select></div>
                                </div>
                                <label className="flex items-center gap-4 bg-white p-4 rounded-2xl border border-gray-200 shadow-sm mt-4 cursor-pointer">
                                    <input type="checkbox" checked={expForm.settled} onChange={e => setExpForm({...expForm, settled: e.target.checked})} className="w-6 h-6 rounded-lg text-primary focus:ring-primary border-gray-300" />
                                    <span className="font-bold text-gray-700">Already Settled / Paid</span>
                                </label>
                                <div className="pt-4"><button onClick={handleSaveExpense} className="w-full bg-primary text-white p-4 rounded-2xl font-black text-lg shadow-lg">Save Expense</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            
            // App Data State
            const [shoppingList, setShoppingList] = useState([]);
            const [events, setEvents] = useState([]);
            const [pets, setPets] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [moodHistory, setMoodHistory] = useState([]);

            // Auth State
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authLoading, setAuthLoading] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // Firebase Auth Listener
            useEffect(() => {
                if(!window.firebaseAuth) return;
                const unsubscribe = window.onAuthStateChanged(window.firebaseAuth, (user) => {
                    setIsAuthenticated(!!user);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                try {
                    await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                } catch (error) {
                    setLoginError('Invalid email or password');
                    console.error(error);
                }
            };

            // Firebase Data Fetching
            useEffect(() => {
                if (!isAuthenticated || !window.firebaseDb) return;
                const baseCollectionPath = `artifacts/${appId}/public/data`;
                
                const subscribe = (colName, setter) => {
                    return window.onSnapshot(
                        window.collection(window.firebaseDb, `${baseCollectionPath}/${colName}`), 
                        (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setter(data);
                        },
                        (error) => console.error(`Error fetching ${colName}:`, error)
                    );
                };

                const unsubShopping = subscribe('shopping', setShoppingList);
                const unsubEvents = subscribe('events', setEvents);
                const unsubPets = subscribe('pets', setPets);
                const unsubExpenses = subscribe('expenses', setExpenses);
                const unsubMoods = subscribe('moods', setMoodHistory);

                return () => { unsubShopping(); unsubEvents(); unsubPets(); unsubExpenses(); unsubMoods(); };
            }, [isAuthenticated]);

            // CRUD Handlers
            const getCollectionPath = (coll) => `artifacts/${appId}/public/data/${coll}`;

            const handleAdd = async (coll, data) => {
                if (!isAuthenticated) return;
                try { await window.addDoc(window.collection(window.firebaseDb, getCollectionPath(coll)), data); } 
                catch (e) { console.error("Error adding doc:", e); }
            };

            const handleUpdate = async (coll, id, data) => {
                if (!isAuthenticated || !id) return;
                try { await window.updateDoc(window.doc(window.firebaseDb, getCollectionPath(coll), id), data); } 
                catch (e) { console.error("Error updating doc:", e); }
            };

            const handleDelete = async (coll, id) => {
                if (!isAuthenticated || !id) return;
                try { await window.deleteDoc(window.doc(window.firebaseDb, getCollectionPath(coll), id)); } 
                catch (e) { console.error("Error deleting doc:", e); }
            };

            const recordMood = async (date, moodId) => {
                 if (!isAuthenticated) return;
                 try {
                     const existing = moodHistory.find(m => m.date === date);
                     if (existing) { await window.updateDoc(window.doc(window.firebaseDb, getCollectionPath('moods'), existing.id), { mood: moodId }); } 
                     else { await window.addDoc(window.collection(window.firebaseDb, getCollectionPath('moods')), { date, user: USERS.ME, mood: moodId }); }
                 } catch(e) { console.error("Error saving mood", e); }
            };

            // Loading state
            if (authLoading) {
                 return <div className="min-h-screen bg-white flex flex-col items-center justify-center"><div className="w-10 h-10 border-4 border-gray-100 border-t-primary rounded-full animate-spin"></div></div>;
            }

            // Login Screen (Matching provided design)
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-white flex flex-col items-center p-6 pt-16 text-center relative overflow-hidden">
                        {/* Blobs Header */}
                        <div className="relative h-40 w-full max-w-[280px] mb-6 mx-auto flex items-center justify-center">
                             <div className="absolute w-16 h-16 bg-orange-400 rounded-[1.5rem] right-10 top-2 flex items-center justify-center text-white"><Smile size={32}/></div>
                             <div className="absolute w-24 h-24 bg-pink-500 rounded-full z-10 flex items-center justify-center text-white shadow-sm"><Smile size={40} strokeWidth={1.5}/></div>
                             <div className="absolute w-16 h-16 bg-orange-500 rounded-[1.2rem] left-10 top-14 flex items-center justify-center text-white"><Meh size={28}/></div>
                             <div className="absolute w-8 h-8 bg-teal-400 rounded-full left-12 bottom-6 z-20 flex items-center justify-center text-white"><Smile size={16}/></div>
                        </div>

                        <h1 className="text-[32px] font-black text-primary mb-3">Our Homie</h1>
                        <p className="text-gray-500 text-sm mb-8 max-w-[260px] leading-relaxed font-bold">
                            Manage our home together. Shopping, calendar, pets, and shared finances, all in one app
                        </p>

                        <div className="w-full max-w-sm flex bg-gray-50 p-1 rounded-full mb-6 border border-gray-100">
                            <button className="flex-1 py-3 text-sm font-black text-primary bg-white rounded-full shadow-sm">Sign In</button>
                            <button className="flex-1 py-3 text-sm font-bold text-gray-500">Sign Up</button>
                        </div>

                        <form onSubmit={handleLogin} className="w-full max-w-sm space-y-4">
                            {loginError && <p className="text-red-500 text-sm font-bold">{loginError}</p>}
                            
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none"><User size={18} className="text-gray-400" /></div>
                                <input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full pl-12 pr-5 py-4 rounded-full border border-gray-100 bg-white shadow-sm outline-none focus:border-primary font-bold text-gray-700 text-sm placeholder:text-gray-400" />
                            </div>
                            
                            <div className="relative mb-2">
                                <div className="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none"><Settings size={18} className="text-gray-400" /></div>
                                <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-12 pr-12 py-4 rounded-full border border-gray-100 bg-white shadow-sm outline-none focus:border-primary font-bold text-gray-700 text-sm placeholder:text-gray-400" />
                                <div className="absolute inset-y-0 right-0 pr-5 flex items-center"><Eye size={18} className="text-gray-300 cursor-pointer hover:text-gray-500" /></div>
                            </div>
                            
                            <button type="submit" className="w-full bg-primary text-white font-black py-4 rounded-full shadow-lg shadow-primary/20 flex justify-center items-center gap-2 mt-4 text-base active:scale-95 transition-transform">
                                <ArrowRight size={20} /> Sign In
                            </button>
                            
                            <p className="text-gray-400 text-sm font-bold mt-6 underline cursor-pointer hover:text-gray-600">Forgot password?</p>
                        </form>
                    </div>
                );
            }

            // Main App Router
            return (
                <div className="min-h-screen h-[100dvh] bg-background relative max-w-md mx-auto shadow-2xl overflow-hidden font-sans flex flex-col">
                    <div className="flex-1 overflow-hidden relative">
                        {activeTab === 'home' && <HomeScreen setActiveTab={setActiveTab} shoppingList={shoppingList} events={events} pets={pets} />}
                        {activeTab === 'shopping' && <ShoppingScreen list={shoppingList} onAdd={handleAdd} onUpdate={handleUpdate} onDelete={handleDelete} />}
                        {activeTab === 'calendar' && <CalendarScreen events={events} moodHistory={moodHistory} recordMood={recordMood} onAdd={handleAdd} onUpdate={handleUpdate} onDelete={handleDelete} />}
                        {activeTab === 'pet' && <PetScreen pets={pets} onAdd={handleAdd} onDelete={handleDelete} />}
                        {activeTab === 'finance' && <FinanceScreen expenses={expenses} onAdd={handleAdd} onUpdate={handleUpdate} onDelete={handleDelete} />}
                    </div>
                    <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} shoppingCount={shoppingList.filter(i => !i.completed).length} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
