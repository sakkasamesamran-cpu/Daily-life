<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Homie</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8B1818">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B1818',
                        'primary-light': '#F8E8E8',
                        secondary: '#4A4A4A',
                        background: '#FAFAFA',
                        card: '#FFFFFF',
                        // Pastel accents
                        'pastel-pink': '#FFD6E0',
                        'pastel-teal': '#D4F0F0',
                        'pastel-orange': '#FFE4D6',
                        'pastel-yellow': '#FFF5D1',
                        'pastel-purple': '#E8DFF5',
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.05)',
                        'card': '0 2px 10px rgba(0, 0, 0, 0.02)',
                    },
                    borderRadius: {
                        'xl': '1rem',
                        '2xl': '1.5rem',
                        '3xl': '2rem',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Fix for Lucide React UMD expecting lowercase react -->
    <script>window.react = window.React;</script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Expose Firebase to the global scope so React can use it
        window.firebaseApp = initializeApp(typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Fallback config if not provided by environment (though it should be)
            projectId: "demo-project"
        });
        window.firebaseDb = getFirestore(window.firebaseApp);
        window.firebaseAuth = getAuth(window.firebaseApp);
        
        window.signInAnonymously = signInAnonymously;
        window.signInWithCustomToken = signInWithCustomToken;
        window.onAuthStateChanged = onAuthStateChanged;
        window.doc = doc;
        window.setDoc = setDoc;
        window.onSnapshot = onSnapshot;
        window.collection = collection;
        window.query = query;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.addDoc = addDoc;
    </script>

    <style>
        /* Base styles to prevent scrolling bounce on iOS and hide scrollbars */
        body {
            background-color: #FAFAFA;
            color: #333333;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Safe area insets for iOS devices with notch */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }

        /* Custom Checkbox */
        .custom-checkbox input:checked + div {
            background-color: #10B981;
            border-color: #10B981;
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }
        
        /* Glass effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Use window.LucideReact which is the correct global for the lucide-react UMD build
        const LucideIcons = window.LucideReact || window.lucide;
        const { 
            Home, ShoppingCart, Calendar: CalendarIcon, PawPrint, Wallet, User,
            ChevronRight, ChevronLeft, Plus, Check, Search, Bell, Settings,
            Trophy, Droplets, Pill, Scissors, Bone, Flame, Lightbulb, Activity,
            Coffee, Utensils, Zap, Wifi, ArrowRight, X, Clock, MapPin, Repeat,
            Smile, Frown, Meh, Angry, Heart
        } = LucideIcons;

        // --- Mock Data ---
        const USERS = {
            ME: 'Cartune',
            PARTNER: 'Gun'
        };

        const INITIAL_SHOPPING = [
            { id: 1, text: 'หลอดไฟ', category: 'Home', completed: false, addedBy: USERS.ME },
            { id: 2, text: 'เช็คไส้กรองอากาศ', category: 'Home', completed: false, addedBy: USERS.PARTNER },
            { id: 3, text: 'เช็คฟิลเตอร์น้ำพุแมว', category: 'Pets', completed: false, addedBy: USERS.ME },
            { id: 4, text: 'เนื้อไก่', category: 'Food', completed: true, addedBy: USERS.PARTNER },
        ];

        const INITIAL_PETS = [
            { id: 1, name: 'Leah', type: 'Dog', breed: 'Cocker Spaniel', gender: 'Female', age: '1 yr 10 mo', weight: '10 Kg', lastVaccine: '8 Feb 2026', imageColor: 'bg-orange-200', nextTask: 'Shower', taskIcon: Droplets },
            { id: 2, name: 'Lupin', type: 'Cat', breed: 'Persian Cat', gender: 'Male', age: '8 yr 3 mo', weight: '4.2 Kg', lastVaccine: '15 Jun 2026', imageColor: 'bg-slate-200' },
            { id: 3, name: 'Luka', type: 'Cat', breed: 'American shorthair', gender: 'Male', age: '5 yr 7 mo', weight: '4.5 Kg', lastVaccine: '15 Jun 2026', imageColor: 'bg-gray-300' }
        ];

        const INITIAL_EXPENSES = [
            { id: 1, title: 'แหวนสายยาง+เทปพันเกลียว', amount: 55, paidBy: USERS.PARTNER, category: 'Home Supplies', date: 'Today', settled: true, icon: Lightbulb, iconColor: 'text-blue-500', bg: 'bg-blue-100' },
            { id: 2, title: 'ค่าเน็ต', amount: 640, paidBy: USERS.PARTNER, category: 'Utilities', date: 'Today', settled: true, icon: Wifi, iconColor: 'text-teal-500', bg: 'bg-teal-100' },
            { id: 3, title: 'BigC', amount: 343, paidBy: USERS.PARTNER, category: 'Food', date: 'Today', settled: true, icon: Utensils, iconColor: 'text-blue-500', bg: 'bg-blue-100' },
            { id: 4, title: 'ค่าบัตร Odyssey', amount: 1100, paidBy: USERS.PARTNER, category: 'Personal', date: 'Today', settled: true, icon: Coffee, iconColor: 'text-red-500', bg: 'bg-red-100' },
            { id: 5, title: 'พิซซ่าวันเกิดพี่แป้ง', amount: 580, paidBy: USERS.PARTNER, category: 'Food', date: 'Today', settled: true, icon: Utensils, iconColor: 'text-orange-500', bg: 'bg-orange-100' },
            { id: 6, title: 'โลตัส', amount: 3285.5, paidBy: USERS.PARTNER, category: 'Home Supplies', date: 'Today', settled: true, icon: Zap, iconColor: 'text-blue-500', bg: 'bg-blue-100' },
            { id: 7, title: 'หอมฟุ้ง 30.07', amount: 200, paidBy: USERS.PARTNER, category: 'Pets', date: 'Today', settled: true, icon: PawPrint, iconColor: 'text-red-400', bg: 'bg-red-100' },
            { id: 8, title: 'Bbq plaza', amount: 1080, paidBy: USERS.ME, category: 'Food', date: 'Today', settled: true, icon: Utensils, iconColor: 'text-orange-500', bg: 'bg-orange-100' },
            { id: 9, title: 'Petclub', amount: 2038, paidBy: USERS.ME, category: 'Pets', date: 'Today', settled: true, icon: PawPrint, iconColor: 'text-red-400', bg: 'bg-red-100' },
            { id: 10, title: 'ค่าไฟ', amount: 2223.5, paidBy: USERS.PARTNER, category: 'Utilities', date: 'Yesterday', settled: false, icon: Zap, iconColor: 'text-yellow-500', bg: 'bg-yellow-100' },
            { id: 11, title: 'ค่าอาหารแมว', amount: 1000, paidBy: USERS.ME, category: 'Pets', date: 'Yesterday', settled: false, icon: Bone, iconColor: 'text-red-400', bg: 'bg-red-100' }
        ];

        const INITIAL_EVENTS = [
            { id: 1, title: 'หาหมอ มนารมย์', date: '2026-09-13', time: '11:00', type: 'Shared', location: 'Manarom hospital' },
            { id: 2, title: 'ย้อมผมที่ enrich', date: '2026-09-20', time: '14:00', type: 'Personal', points: 100 }
        ];

        const MOODS = [
            { id: 'happy', icon: Smile, label: 'Happy', color: 'bg-pink-400', text: 'text-pink-500' },
            { id: 'calm', icon: Meh, label: 'Calm', color: 'bg-indigo-400', text: 'text-indigo-500' },
            { id: 'sad', icon: Frown, label: 'Sad', color: 'bg-blue-400', text: 'text-blue-500' },
            { id: 'angry', icon: Angry, label: 'Angry', color: 'bg-orange-500', text: 'text-orange-600' },
            { id: 'tired', icon: Meh, label: 'Tired', color: 'bg-orange-400', text: 'text-orange-500' }
        ];

        const INITIAL_MOOD_HISTORY = {
            '2026-09-01': { user: USERS.ME, mood: 'tired' },
            '2026-09-02': { user: USERS.ME, mood: 'happy' },
            '2026-09-03': { user: USERS.PARTNER, mood: 'sad' },
            '2026-09-04': { user: USERS.ME, mood: 'calm' },
        };

        // --- Helper Components ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const LucideIcon = LucideIcons[name] || LucideIcons.HelpCircle;
            return <LucideIcon size={size} className={className} />;
        };

        const BottomNav = ({ activeTab, setActiveTab, cartCount }) => {
            const navItems = [
                { id: 'home', icon: Home, label: 'Home' },
                { id: 'shopping', icon: ShoppingCart, label: 'Shopping', badge: cartCount },
                { id: 'calendar', icon: CalendarIcon, label: 'Calendar' },
                { id: 'pet', icon: PawPrint, label: 'Pet' },
                { id: 'finance', icon: Wallet, label: 'Finance' },
                { id: 'profile', icon: User, label: 'Profile' }
            ];

            return (
                <div className="fixed bottom-0 w-full bg-white border-t border-gray-100 pb-safe pt-2 px-2 flex justify-between items-center z-50">
                    {navItems.map(item => (
                        <button 
                            key={item.id}
                            onClick={() => setActiveTab(item.id)}
                            className={`flex flex-col items-center p-2 w-full ${activeTab === item.id ? 'text-primary' : 'text-gray-400'}`}
                        >
                            <div className="relative">
                                <item.icon size={22} strokeWidth={activeTab === item.id ? 2.5 : 2} />
                                {item.badge > 0 && (
                                    <span className="absolute -top-1 -right-2 bg-primary text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">
                                        {item.badge}
                                    </span>
                                )}
                            </div>
                            <span className="text-[10px] mt-1 font-medium">{item.label}</span>
                        </button>
                    ))}
                </div>
            );
        };

        const TopBar = ({ title, subtitle, rightAction }) => (
            <div className="pt-safe px-5 pb-3 bg-background/80 backdrop-blur-md sticky top-0 z-40">
                <div className="flex justify-between items-end mt-4">
                    <div>
                        <h1 className="text-2xl font-bold flex items-center gap-2">
                            {title === 'Finance' && <Wallet className="text-primary" size={24} />}
                            {title === 'Shopping List' && <ShoppingCart className="text-primary" size={24} />}
                            {title === 'Calendar' && <CalendarIcon className="text-primary" size={24} />}
                            {title === 'My Pets' && <PawPrint className="text-primary" size={24} />}
                            {title}
                        </h1>
                        {subtitle && <p className="text-gray-500 text-sm mt-1">{subtitle}</p>}
                    </div>
                    {rightAction}
                </div>
            </div>
        );

        // --- Screens ---

        // 1. Home Screen
        const HomeScreen = ({ setActiveTab, shoppingList, events, pets }) => {
            const pendingShopping = shoppingList.filter(item => !item.completed).length;
            const upcomingEvents = events.length;
            const petTasks = pets.filter(p => p.nextTask).length;
            const budgetPercent = 194; // Mock

            return (
                <div className="p-5 pb-24 space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-300">
                    {/* Quick Stats */}
                    <div className="grid grid-cols-4 gap-3">
                        <button onClick={() => setActiveTab('shopping')} className="bg-pastel-pink/50 p-3 rounded-2xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                            <ShoppingCart className="text-pink-400" size={24} />
                            <span className="font-bold text-lg text-primary">{pendingShopping}</span>
                            <span className="text-xs text-gray-500">Shopping</span>
                        </button>
                        <button onClick={() => setActiveTab('calendar')} className="bg-pastel-teal/50 p-3 rounded-2xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                            <CalendarIcon className="text-teal-500" size={24} />
                            <span className="font-bold text-lg text-teal-700">{upcomingEvents}</span>
                            <span className="text-xs text-gray-500">Events</span>
                        </button>
                        <button onClick={() => setActiveTab('pet')} className="bg-pastel-orange/50 p-3 rounded-2xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                            <PawPrint className="text-orange-400" size={24} />
                            <span className="font-bold text-lg text-orange-700">{petTasks}</span>
                            <span className="text-xs text-gray-500">Pet Care</span>
                        </button>
                        <button onClick={() => setActiveTab('finance')} className="bg-primary-light p-3 rounded-2xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                            <Wallet className="text-primary" size={24} />
                            <span className="font-bold text-lg text-primary">{budgetPercent}%</span>
                            <span className="text-xs text-gray-500">Budget</span>
                        </button>
                    </div>

                    {/* Awards */}
                    <div>
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-xl font-bold">Awards</h2>
                            <button className="text-sm font-medium text-primary flex items-center">View All <ChevronRight size={16} /></button>
                        </div>
                        <div className="bg-primary-light rounded-2xl p-4 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="bg-white p-2 rounded-full text-primary shadow-sm">
                                    <Trophy size={20} />
                                </div>
                                <div>
                                    <p className="text-xs text-gray-500 mb-1">Your points</p>
                                    <p className="font-bold text-lg">0 / 100 pts</p>
                                    <p className="text-xs text-primary mt-1">Next: ย้อมผมที่ enrich</p>
                                </div>
                            </div>
                            <button className="bg-white p-2 rounded-full shadow-sm">
                                <ChevronRight size={16} className="text-gray-400" />
                            </button>
                        </div>
                    </div>

                    {/* Today's Pet */}
                    <div>
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-xl font-bold">Today's Pet</h2>
                            <button onClick={() => setActiveTab('pet')} className="text-sm font-medium text-primary flex items-center">View All <ChevronRight size={16} /></button>
                        </div>
                        {pets.filter(p => p.nextTask).map(pet => (
                            <div key={pet.id} className="bg-gradient-to-r from-pastel-teal/30 to-pastel-teal/10 rounded-2xl p-4 flex items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <div className={`w-14 h-14 rounded-full ${pet.imageColor} overflow-hidden flex items-center justify-center border-2 border-white shadow-sm`}>
                                        <PawPrint className="text-white/50" size={30} />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg">{pet.name}</h3>
                                        <div className="flex items-center gap-1 text-teal-600 text-sm font-medium">
                                            {pet.taskIcon && <pet.taskIcon size={14} />}
                                            {pet.nextTask}
                                        </div>
                                    </div>
                                </div>
                                <button className="bg-primary text-white p-2 rounded-full">
                                    <ArrowRight size={20} />
                                </button>
                            </div>
                        ))}
                    </div>

                    {/* Shopping List Preview */}
                    <div>
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-xl font-bold">Shopping List</h2>
                            <button onClick={() => setActiveTab('shopping')} className="text-sm font-medium text-primary flex items-center">View All <ChevronRight size={16} /></button>
                        </div>
                        <div className="bg-white rounded-3xl p-2 shadow-card border border-gray-50">
                            {shoppingList.filter(i => !i.completed).slice(0, 3).map((item, idx) => (
                                <div key={item.id} className={`flex items-center justify-between p-3 ${idx !== 2 ? 'border-b border-gray-50' : ''}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-5 h-5 rounded border-2 border-gray-200"></div>
                                        <span className="text-gray-700">{item.text}</span>
                                    </div>
                                    <span className="text-xs text-blue-400 bg-blue-50 px-2 py-1 rounded-md">{item.category}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Upcoming Events Preview */}
                     <div>
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-xl font-bold">Upcoming Events</h2>
                            <button onClick={() => setActiveTab('calendar')} className="text-sm font-medium text-primary flex items-center">View All <ChevronRight size={16} /></button>
                        </div>
                        <div className="bg-white rounded-3xl shadow-card border border-gray-50 p-4">
                            {events.map((event) => (
                                <div key={event.id} className="flex items-center gap-4 mb-3 last:mb-0">
                                    <div className="flex flex-col items-center w-12">
                                        <span className="text-xl font-bold text-primary">{event.date.split('-')[2]}</span>
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="font-semibold text-gray-800">{event.title}</h3>
                                        {event.location && <p className="text-xs text-gray-500 truncate">{event.location}</p>}
                                    </div>
                                    <div className={`w-2 h-2 rounded-full ${event.type === 'Shared' ? 'bg-primary' : 'bg-blue-500'}`}></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Shopping List Screen
        const ShoppingScreen = ({ list, addShoppingItem, toggleShoppingItem }) => {
            const [filter, setFilter] = useState('All');
            const categories = ['All', 'Food', 'Home', 'Health', 'Pets'];
            const [newItemText, setNewItemText] = useState('');

            const addItem = (e) => {
                if (e.key === 'Enter' && newItemText.trim()) {
                    addShoppingItem({
                        text: newItemText,
                        category: filter === 'All' ? 'Home' : filter,
                        completed: false,
                        addedBy: USERS.ME
                    });
                    setNewItemText('');
                }
            };

            const filteredList = filter === 'All' ? list : list.filter(i => i.category === filter);
            const activeItems = filteredList.filter(i => !i.completed);
            const completedItems = filteredList.filter(i => i.completed);

            return (
                <div className="h-full bg-background pb-24 flex flex-col animate-in fade-in slide-in-from-right-8 duration-300">
                    <TopBar title="Shopping List" subtitle="Added by Cartune & Gun" />
                    
                    <div className="px-5">
                        {/* Categories */}
                        <div className="flex gap-2 overflow-x-auto pb-4 no-scrollbar mt-2">
                            {categories.map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => setFilter(cat)}
                                    className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium flex items-center gap-1 transition-colors
                                        ${filter === cat ? 'bg-primary text-white' : 'bg-primary-light text-primary'}`}
                                >
                                    {cat === 'All' && <Activity size={14} />}
                                    {cat === 'Food' && <Utensils size={14} />}
                                    {cat === 'Home' && <Home size={14} />}
                                    {cat === 'Health' && <Pill size={14} />}
                                    {cat === 'Pets' && <PawPrint size={14} />}
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* List Area */}
                        <div className="bg-white rounded-3xl p-2 shadow-card border border-gray-50 mt-2">
                            {activeItems.map((item, idx) => (
                                <label key={item.id} className={`flex items-center justify-between p-3 cursor-pointer ${idx !== activeItems.length - 1 ? 'border-b border-gray-50' : ''}`}>
                                    <div className="flex items-center gap-3 custom-checkbox">
                                        <input type="checkbox" className="hidden" checked={item.completed} onChange={() => toggleShoppingItem(item.id, item.completed)} />
                                        <div className="w-5 h-5 rounded border-2 border-gray-300 flex items-center justify-center transition-colors">
                                            <Check size={14} className="text-white hidden" strokeWidth={3} />
                                        </div>
                                        <span className="text-gray-700 text-lg">{item.text}</span>
                                    </div>
                                    <span className="text-xs text-blue-500 bg-blue-50 px-2 py-1 rounded-md">{item.category}</span>
                                </label>
                            ))}
                            
                            {/* Add Item Input */}
                            <div className={`flex items-center gap-3 p-3 text-gray-400 ${activeItems.length > 0 ? 'border-t border-gray-50' : ''}`}>
                                <Plus size={20} />
                                <input 
                                    type="text" 
                                    placeholder="Add item..." 
                                    className="bg-transparent outline-none flex-1 text-gray-700"
                                    value={newItemText}
                                    onChange={(e) => setNewItemText(e.target.value)}
                                    onKeyDown={addItem}
                                />
                            </div>
                        </div>

                        {completedItems.length > 0 && (
                            <div className="mt-6">
                                <h3 className="text-sm font-semibold text-gray-400 mb-3 ml-2 uppercase">Completed</h3>
                                <div className="bg-white rounded-3xl p-2 shadow-card border border-gray-50 opacity-60">
                                    {completedItems.map((item, idx) => (
                                        <label key={item.id} className={`flex items-center justify-between p-3 cursor-pointer ${idx !== completedItems.length - 1 ? 'border-b border-gray-50' : ''}`}>
                                            <div className="flex items-center gap-3 custom-checkbox">
                                                <input type="checkbox" className="hidden" checked={item.completed} onChange={() => toggleShoppingItem(item.id, item.completed)} />
                                                <div className="w-5 h-5 rounded border-2 border-gray-300 flex items-center justify-center transition-colors">
                                                    <Check size={14} className="text-white hidden" strokeWidth={3} />
                                                </div>

                                            <expense.icon size={20} />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-gray-800 text-sm mb-0.5">{expense.title}</h4>
                                            <div className="flex items-center gap-2 text-xs text-gray-500">
                                                <div className="w-4 h-4 rounded-full bg-gray-800 text-white flex items-center justify-center text-[8px] font-bold">
                                                    {expense.paidBy.charAt(0)}
                                                </div>
                                                <span>{expense.paidBy}</span>
                                                <span>·</span>
                                                <span>{expense.date}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-end gap-2">
                                        <span className="font-bold text-gray-800">฿ {expense.amount.toLocaleString()}</span>
                                        {expense.settled ? (
                                            <div className="w-5 h-5 rounded bg-teal-500 flex items-center justify-center">
                                                <Check size={14} className="text-white" strokeWidth={3} />
                                            </div>
                                        ) : (
                                            <div className="w-5 h-5 rounded border-2 border-gray-300"></div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authLoading, setAuthLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            
            // Shared State
            const [shoppingList, setShoppingList] = useState([]);
            const [events, setEvents] = useState([]);
            const [pets, setPets] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [moodHistory, setMoodHistory] = useState({});

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'homie-app';
            const userId = window.firebaseAuth?.currentUser?.uid || 'anonymous';

            useEffect(() => {
                if (!window.firebaseAuth) {
                    setAuthLoading(false);
                    return;
                }

                const authenticate = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined') {
                            await window.signInWithCustomToken(window.firebaseAuth, __initial_auth_token);
                        } else {
                            await window.signInAnonymously(window.firebaseAuth);
                        }
                    } catch (error) {
                        console.error("Authentication failed:", error);
                    } finally {
                        setAuthLoading(false);
                    }
                };

                const unsubscribe = window.onAuthStateChanged(window.firebaseAuth, (user) => {
                    if (user) {
                        setIsAuthenticated(true);
                    } else if (!authLoading) {
                        authenticate();
                    }
                });

                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isAuthenticated || !window.firebaseDb) return;

                const db = window.firebaseDb;

                // 1. Shopping List Listener
                const shoppingRef = window.collection(db, 'artifacts', appId, 'public', 'data', 'shopping');
                const unsubShopping = window.onSnapshot(shoppingRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach((doc) => {
                        items.push({ id: doc.id, ...doc.data() });
                    });
                    setShoppingList(items.length > 0 ? items : INITIAL_SHOPPING); // Fallback to initial data if empty for demo
                }, (error) => console.error("Shopping fetch error:", error));

                // 2. Events Listener
                const eventsRef = window.collection(db, 'artifacts', appId, 'public', 'data', 'events');
                const unsubEvents = window.onSnapshot(eventsRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach((doc) => {
                        items.push({ id: doc.id, ...doc.data() });
                    });
                    setEvents(items.length > 0 ? items : INITIAL_EVENTS);
                });

                // 3. Pets Listener
                const petsRef = window.collection(db, 'artifacts', appId, 'public', 'data', 'pets');
                const unsubPets = window.onSnapshot(petsRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach((doc) => {
                        items.push({ id: doc.id, ...doc.data() });
                    });
                    // For demo, if empty, we initialize it
                    if (items.length === 0) {
                        setPets(INITIAL_PETS);
                    } else {
                        // Re-attach icons because they can't be stored in JSON
                        const populatedPets = items.map(pet => {
                            let taskIcon = null;
                            if (pet.taskIconName === 'Droplets') taskIcon = Droplets;
                            return { ...pet, taskIcon };
                        });
                        setPets(populatedPets);
                    }
                });

                // 4. Expenses Listener
                const expensesRef = window.collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
                const unsubExpenses = window.onSnapshot(expensesRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach((doc) => {
                        items.push({ id: doc.id, ...doc.data() });
                    });
                    
                    if (items.length === 0) {
                         setExpenses(INITIAL_EXPENSES);
                    } else {
                        // Reconstruct icons
                        const populatedExpenses = items.map(exp => {
                             let icon = Utensils; // fallback
                             if (exp.iconName === 'Lightbulb') icon = Lightbulb;
                             if (exp.iconName === 'Wifi') icon = Wifi;
                             if (exp.iconName === 'Coffee') icon = Coffee;
                             if (exp.iconName === 'Zap') icon = Zap;
                             if (exp.iconName === 'PawPrint') icon = PawPrint;
                             if (exp.iconName === 'Bone') icon = Bone;
                             return { ...exp, icon };
                        });
                        setExpenses(populatedExpenses);
                    }
                });

                // 5. Mood History Listener
                const moodRef = window.collection(db, 'artifacts', appId, 'public', 'data', 'moods');
                const unsubMoods = window.onSnapshot(moodRef, (snapshot) => {
                    const history = {};
                    snapshot.forEach((doc) => {
                        history[doc.id] = doc.data();
                    });
                    setMoodHistory(Object.keys(history).length > 0 ? history : INITIAL_MOOD_HISTORY);
                });

                return () => {
                    unsubShopping();
                    unsubEvents();
                    unsubPets();
                    unsubExpenses();
                    unsubMoods();
                };
            }, [isAuthenticated, appId]);

            const addShoppingItem = async (item) => {
                if (!isAuthenticated || !window.firebaseDb) return;
                try {
                    const collRef = window.collection(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'shopping');
                    await window.addDoc(collRef, item);
                } catch (e) { console.error("Error adding item:", e); }
            };

            const toggleShoppingItem = async (id, currentStatus) => {
                if (!isAuthenticated || !window.firebaseDb) return;
                // Since INITIAL_SHOPPING uses numeric IDs, we handle both temporary local objects and firestore docs
                if (typeof id === 'number') {
                     // Local state update for initial mock data
                     setShoppingList(shoppingList.map(item => item.id === id ? { ...item, completed: !item.completed } : item));
                     return;
                }
                try {
                    const docRef = window.doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'shopping', id);
                    await window.updateDoc(docRef, { completed: !currentStatus });
                } catch (e) { console.error("Error toggling item:", e); }
            };

            const recordMood = async (date, moodId) => {
                 if (!isAuthenticated || !window.firebaseDb) return;
                 try {
                     const docRef = window.doc(window.firebaseDb, 'artifacts', appId, 'public', 'data', 'moods', date);
                     await window.setDoc(docRef, { user: USERS.ME, mood: moodId });
                 } catch(e) { console.error("Error saving mood", e); }
            };

            // Initializing database with mock data if it's empty (just for demo purposes in this environment)
            const initializeDatabaseIfEmpty = async () => {
                 if (!isAuthenticated || !window.firebaseDb) return;
                 // In a real app we'd check if it's empty first, but for this demo context
                 // we rely on the snapshots falling back to local state if empty.
            };

            if (authLoading) {
                 return <div className="min-h-screen bg-white flex items-center justify-center"><div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div></div>;
            }

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-white flex flex-col items-center justify-center p-6 text-center animate-in fade-in duration-500">
                        {/* Decorative Graphic from Login Screen */}
                        <div className="relative h-48 w-full max-w-xs mb-8 flex items-center justify-center">
                             {/* Mocking the shapes with Tailwind and Lucide */}
                             <div className="absolute w-16 h-16 bg-orange-400 rounded-[2rem] -rotate-12 right-12 top-10 flex items-center justify-center text-white"><Meh size={32}/></div>
                             <div className="absolute w-28 h-28 bg-pink-500 rounded-full z-10 flex items-center justify-center text-white shadow-lg"><Smile size={48} strokeWidth={1.5}/></div>
                             <div className="absolute w-20 h-20 bg-orange-500 rounded-3xl left-8 top-16 rotate-12 flex items-center justify-center text-white"><Smile size={32}/></div>
                             <div className="absolute w-8 h-8 bg-teal-400 rounded-full left-12 bottom-10 z-20 flex items-center justify-center"><Smile size={16} className="text-white"/></div>
                        </div>

                        <h1 className="text-3xl font-black text-primary mb-2">Our Homie</h1>
                        <p className="text-gray-500 text-sm mb-10 max-w-xs leading-relaxed">
                            Manage our home together. Shopping, calendar, pets, and shared finances, all in one app
                        </p>

                        <div className="w-full max-w-sm space-y-4">
                            <div className="flex bg-primary-light p-1 rounded-full mb-6">
                                <button className="flex-1 bg-white text-primary font-bold py-3 rounded-full shadow-sm text-sm">Sign In</button>
                                <button className="flex-1 text-gray-500 font-bold py-3 rounded-full text-sm">Sign Up</button>
                            </div>
                            
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <User size={20} className="text-gray-400" />
                                </div>
                                <input type="email" placeholder="Email" className="w-full pl-11 pr-4 py-4 rounded-2xl border border-gray-100 bg-gray-50/50 outline-none focus:border-primary transition-colors text-sm" />
                            </div>
                            
                            <div className="relative mb-2">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <Settings size={20} className="text-gray-400" />
                                </div>
                                <input type="password" placeholder="Password" className="w-full pl-11 pr-12 py-4 rounded-2xl border border-gray-100 bg-gray-50/50 outline-none focus:border-primary transition-colors text-sm" />
                                <div className="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer">
                                    <Activity size={20} className="text-gray-400" /> {/* Eye icon placeholder */}
                                </div>
                            </div>
                            
                            <button 
                                onClick={() => setIsAuthenticated(true)}
                                className="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg shadow-primary/30 flex justify-center items-center gap-2 mt-6 active:scale-[0.98] transition-transform"
                            >
                                <ArrowRight size={20} /> Sign In
                            </button>
                            
                            <button className="text-sm text-gray-500 mt-4 underline decoration-gray-300 underline-offset-4">Forgot password?</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-background relative max-w-md mx-auto shadow-2xl overflow-hidden">
                    {activeTab === 'home' && <HomeScreen setActiveTab={setActiveTab} shoppingList={shoppingList} events={events} pets={pets} />}
                    {activeTab === 'shopping' && <ShoppingScreen list={shoppingList} addShoppingItem={addShoppingItem} toggleShoppingItem={toggleShoppingItem} />}
                    {activeTab === 'calendar' && <CalendarScreen events={events} moodHistory={moodHistory} recordMood={recordMood} />}
                    {activeTab === 'pet' && <PetScreen pets={pets} />}
                    {activeTab === 'finance' && <FinanceScreen expenses={expenses} />}
                    
                    <BottomNav 
                        activeTab={activeTab} 
                        setActiveTab={setActiveTab} 
                        cartCount={shoppingList.filter(i => !i.completed).length}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
